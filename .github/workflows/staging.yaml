name: Deploy to Staging

on:
  push:
    branches:
      - feature/ecommerce-deployment

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ecommerce-staging
  ECS_CLUSTER: ecommerce-staging-cluster
  ECS_SERVICE: ecommerce-staging-service
  AWS_ACCOUNT_ID: 343980058896

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:

      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Test AWS credentials
      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY ./app

      # 6. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 7. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 8. Deploy to ECS
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      # 9. Wait for ECS deployment
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      # 10. Success
      - name: Deployment successful
        run: |
          echo "Staging deployment completed successfully."
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"